<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>30km Run - ランニングイベント記録</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      background: #f5f5f5;
      color: #333;
    }
    .app { max-width: 740px; margin: 0 auto; padding: 1.5rem 1rem; }
    .tab-bar { display: flex; gap: 4px; background: #e8e8e8; border-radius: 12px; padding: 4px; margin-bottom: 1.5rem; }
    .tab { flex: 1; padding: 8px; border: none; background: transparent; border-radius: 8px; font-size: 13px; font-weight: 500; color: #666; cursor: pointer; transition: background 0.15s; }
    .tab.active { background: white; color: #333; border: 0.5px solid #ddd; }
    .page { display: none; }
    .page.active { display: block; }
    .card { background: white; border: 0.5px solid #ddd; border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; }
    .form-label { font-size: 12px; color: #666; margin-bottom: 6px; display: block; font-weight: 500; }
    input[type="text"], input[type="password"], input[type="number"], select { width: 100%; margin-bottom: 12px; padding: 10px; border: 0.5px solid #ddd; border-radius: 8px; font-size: 14px; }
    input:focus, select:focus { outline: none; border-color: #3266ad; }
    .btn-primary { width: 100%; padding: 10px; background: #3266ad; border: none; border-radius: 8px; color: #fff; font-size: 14px; font-weight: 500; cursor: pointer; }
    .btn-primary:hover { background: #2558a0; }
    .btn-secondary { padding: 8px 16px; background: transparent; border: 0.5px solid #ddd; border-radius: 8px; color: #333; font-size: 13px; cursor: pointer; }
    .btn-small { padding: 6px 12px; font-size: 12px; background: transparent; border: 0.5px solid #ddd; border-radius: 8px; cursor: pointer; color: #333; }
    .btn-small:hover { background: #f0f0f0; }
    .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 1.5rem; }
    .metric { background: #f8f8f8; border-radius: 8px; padding: 14px; text-align: center; }
    .metric-label { font-size: 11px; color: #666; margin-bottom: 6px; letter-spacing: 0.05em; }
    .metric-value { font-size: 22px; font-weight: 500; color: #333; margin-bottom: 2px; }
    .metric-sub { font-size: 11px; color: #999; }
    .section-title { font-size: 13px; font-weight: 500; color: #666; margin-bottom: 12px; letter-spacing: 0.04em; text-transform: uppercase; }
    .record-row { display: flex; align-items: center; justify-content: space-between; padding: 12px; background: #f8f8f8; border-radius: 8px; margin-bottom: 8px; }
    .record-row-info { flex: 1; }
    .record-row-label { font-size: 13px; font-weight: 500; color: #333; }
    .record-row-meta { font-size: 12px; color: #999; margin-top: 2px; }
    .record-row-actions { display: flex; gap: 6px; }
    .empty-state { text-align: center; padding: 2rem; color: #999; font-size: 14px; }
    .user-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 0.5px solid #ddd; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: #e6f1fb; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; color: #0c447c; }
    .pace-badge { display: inline-flex; align-items: center; gap: 6px; background: linear-gradient(135deg, #378add, #185fa5); color: #fff; padding: 6px 12px; border-radius: 99px; font-size: 12px; font-weight: 500; }
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal { background: white; border-radius: 12px; padding: 1.5rem; max-width: 420px; width: 90%; }
    .modal-title { font-size: 16px; font-weight: 500; margin-bottom: 1rem; }
    .modal-close { float: right; background: none; border: none; font-size: 20px; cursor: pointer; color: #999; }
    .pace-step { padding: 14px 12px; border-radius: 8px; background: #f8f8f8; display: flex; align-items: center; justify-content: space-between; border-left: 4px solid #ddd; margin-bottom: 8px; }
    .pace-step.current { background: rgba(50, 102, 173, 0.1); border-left-color: #3266ad; }
    .pace-step.achieved { background: rgba(247, 147, 30, 0.1); border-left-color: #f7931e; }
    .pace-step-info { flex: 1; }
    .pace-step-pace { font-size: 14px; font-weight: 500; color: #333; }
    .pace-step-desc { font-size: 12px; color: #999; margin-top: 2px; }
    .pace-step-badge { font-size: 20px; }
    .achievement-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 10px; margin-bottom: 1rem; }
    .badge-card { text-align: center; padding: 0; border-radius: 12px; overflow: hidden; background: white; border: 0.5px solid #ddd; }
    .badge-card.unlocked { border: 2px solid #f7931e; background: white; }
    .badge-card.locked { opacity: 0.4; }
    .badge-visual { width: 100%; height: 70px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; }
    .badge-visual.first { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
    .badge-visual.three { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; }
    .badge-visual.speedup { background: linear-gradient(135deg, #30cfd0 0%, #330867 100%); color: white; }
    .badge-visual.finish { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color: white; }
    .badge-visual.triple { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); color: white; }
    .badge-visual.elite { background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); color: #333; }
    .badge-name { font-size: 10px; font-weight: 600; color: #333; padding: 6px 4px; }
    .badge-desc { font-size: 8px; color: #999; padding: 0 4px 6px; }
    .share-canvas { background: linear-gradient(135deg, #1a3a6e 0%, #185fa5 50%, #378add 100%); border-radius: 12px; padding: 2rem 1.5rem; margin-bottom: 1.5rem; color: #fff; position: relative; overflow: hidden; }
    .share-canvas::before { content: ''; position: absolute; top: -100px; right: -100px; width: 300px; height: 300px; border-radius: 50%; background: rgba(255,255,255,0.08); }
    .share-canvas::after { content: ''; position: absolute; bottom: -120px; left: -120px; width: 280px; height: 280px; border-radius: 50%; background: rgba(255,255,255,0.06); }
    .share-header { position: relative; z-index: 1; margin-bottom: 1rem; }
    .share-title { font-size: 10px; letter-spacing: 0.2em; opacity: 0.75; font-weight: 500; }
    .share-name { font-size: 24px; font-weight: 500; margin-top: 4px; }
    .share-graph-section { position: relative; z-index: 1; margin-bottom: 1.5rem; }
    .share-graph-title { font-size: 10px; opacity: 0.7; letter-spacing: 0.05em; margin-bottom: 8px; }
    .share-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 1.5rem; position: relative; z-index: 1; }
    .share-stat { }
    .share-stat-label { font-size: 9px; opacity: 0.65; letter-spacing: 0.05em; margin-bottom: 3px; }
    .share-stat-value { font-size: 16px; font-weight: 500; }
    .share-badges { display: flex; gap: 6px; margin-bottom: 1rem; flex-wrap: wrap; position: relative; z-index: 1; }
    .share-badge { width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; color: white; }
    .share-footer { font-size: 8px; opacity: 0.5; letter-spacing: 0.05em; position: relative; z-index: 1; }
    .login-container { max-width: 400px; margin: 4rem auto 0; }
  </style>
</head>
<body>
 
<div class="app">
  <div id="loginPage" class="page active">
    <div style="text-align:center; padding: 2rem 0 1.5rem;">
      <div style="font-size: 28px; font-weight: 500; color: #333; margin-bottom: 8px;">金沢30km挑戦会</div>
      <div style="font-size: 12px; color: #999;">2026年4月～2027年3月</div>
    </div>
    <div class="login-container">
      <div class="card">
        <label class="form-label">ランナー名</label>
        <input type="text" id="loginName" placeholder="例: 田中 太郎" />
        <label class="form-label">パスワード</label>
        <input type="password" id="loginPass" placeholder="••••••••" />
        <button class="btn-primary" onclick="doLogin()">ログイン</button>
        <p id="authMsg" style="font-size:12px;color:#c33;margin-top:8px;display:none;text-align:center;"></p>
      </div>
      <p style="text-align:center;font-size:12px;color:#999;margin-top:1.5rem;">デモ: 田中 太郎 / pass1234</p>
    </div>
  </div>
 
  <div id="mainPage" class="page">
    <div class="user-bar">
      <div style="display:flex;align-items:center;gap:12px;">
        <div class="avatar" id="avatarInitials">TT</div>
        <div style="flex:1;">
          <div style="font-size:14px;font-weight:500;" id="displayName">田中 太郎</div>
          <div id="paceBadgeContainer"></div>
        </div>
      </div>
      <button class="btn-secondary" onclick="doLogout()" style="font-size:12px;">ログアウト</button>
    </div>
 
    <div class="tab-bar">
      <button class="tab active" onclick="switchTab('dashboard')">ダッシュボード</button>
      <button class="tab" onclick="switchTab('record')">記録管理</button>
      <button class="tab" onclick="switchTab('share')">シェア</button>
    </div>
 
    <div id="tabDashboard" class="page active">
      <div class="metric-grid">
        <div class="metric">
          <div class="metric-label">参加回数</div>
          <div class="metric-value" id="mCount">0</div>
          <div class="metric-sub">/ 12回</div>
        </div>
        <div class="metric">
          <div class="metric-label">完走回数</div>
          <div class="metric-value" id="mFinished">0</div>
          <div class="metric-sub">30km</div>
        </div>
        <div class="metric">
          <div class="metric-label">ベストタイム</div>
          <div class="metric-value" id="mBest">—</div>
          <div class="metric-sub">時:分:秒</div>
        </div>
        <div class="metric">
          <div class="metric-label">最長距離</div>
          <div class="metric-value" id="mMaxDist">—</div>
          <div class="metric-sub">km</div>
        </div>
      </div>
 
      <div class="card">
        <div class="section-title">ペースランク進捗</div>
        <div id="paceLadder"></div>
      </div>
 
      <div class="card">
        <div class="section-title">達成バッジ</div>
        <div class="achievement-grid" id="achievementGrid"></div>
      </div>
    </div>
 
    <div id="tabRecord" class="page">
      <div class="card">
        <div class="section-title">新規記録を追加</div>
        <label class="form-label">開催月</label>
        <select id="recMonth">
          <option value="">選択してください</option>
        </select>
        <label class="form-label">参加ペースグループ</label>
        <select id="recPace">
          <option value="">選択してください</option>
          <option value="400">4'00/km</option>
          <option value="415">4'15/km</option>
          <option value="430">4'30/km</option>
          <option value="500">5'00/km</option>
          <option value="530">5'30/km</option>
          <option value="630">6'30/km</option>
        </select>
        <label class="form-label">走行距離（km）</label>
        <input type="number" id="recDist" placeholder="30" min="5" max="35" step="0.5" />
        <label class="form-label">完了時間</label>
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 12px;">
          <div>
            <label class="form-label" style="margin-bottom: 4px;">時</label>
            <input type="number" id="recH" placeholder="0" min="0" max="9" style="margin-bottom: 0;" />
          </div>
          <div>
            <label class="form-label" style="margin-bottom: 4px;">分</label>
            <input type="number" id="recM" placeholder="45" min="0" max="59" style="margin-bottom: 0;" />
          </div>
          <div>
            <label class="form-label" style="margin-bottom: 4px;">秒</label>
            <input type="number" id="recS" placeholder="30" min="0" max="59" style="margin-bottom: 0;" />
          </div>
        </div>
        <button class="btn-primary" onclick="saveRecord()">記録を保存</button>
        <p id="recMsg" style="font-size:13px;margin-top:8px;display:none;"></p>
      </div>
 
      <div class="card">
        <div class="section-title">記録一覧</div>
        <div id="recordList"><div class="empty-state">まだ記録がありません</div></div>
      </div>
    </div>
 
    <div id="tabShare" class="page">
      <div class="share-canvas" id="shareCard">
        <div class="share-header">
          <div class="share-title">KANAZAWA 30KM CHALLENGE 2026-2027</div>
          <div class="share-name" id="shareName">田中 太郎</div>
        </div>
 
        <div class="share-graph-section">
          <div class="share-graph-title">成長の軌跡（ペース × 距離）</div>
          <svg id="shareGraph" width="100%" height="110" viewBox="0 0 280 110" style="overflow: visible;">
          </svg>
        </div>
 
        <div class="share-stats">
          <div class="share-stat">
            <div class="share-stat-label">参加回数</div>
            <div class="share-stat-value" id="shareCount">0回</div>
          </div>
          <div class="share-stat">
            <div class="share-stat-label">ベストタイム</div>
            <div class="share-stat-value" id="shareBest">—</div>
          </div>
          <div class="share-stat">
            <div class="share-stat-label">完走達成</div>
            <div class="share-stat-value" id="shareFinished">0回</div>
          </div>
          <div class="share-stat">
            <div class="share-stat-label">最高ランク</div>
            <div class="share-stat-value" id="shareHighestPace">—</div>
          </div>
        </div>
 
        <div class="share-badges" id="shareBadgesContainer"></div>
 
        <div class="share-footer">
          <span>#30kmRun #月例ラン #ランニングチャレンジ</span>
        </div>
      </div>
      <button class="btn-primary" onclick="doShare()" style="margin-bottom:8px;">シェア画像をコピー</button>
      <p style="font-size:12px;color:#999;text-align:center;">※スクリーンショットでSNSに投稿できます</p>
    </div>
  </div>
 
  <div id="editModal" class="modal-overlay" style="display:none;" onclick="if(event.target===this)closeEditModal()">
    <div class="modal">
      <button class="modal-close" onclick="closeEditModal()">✕</button>
      <div class="modal-title">記録を編集</div>
      <label class="form-label">開催月</label>
      <select id="editMonth">
        <option value="">選択してください</option>
      </select>
      <label class="form-label">ペースグループ</label>
      <select id="editPace">
        <option value="">選択してください</option>
        <option value="400">4'00/km</option>
        <option value="415">4'15/km</option>
        <option value="430">4'30/km</option>
        <option value="500">5'00/km</option>
        <option value="530">5'30/km</option>
        <option value="630">6'30/km</option>
      </select>
      <label class="form-label">走行距離（km）</label>
      <input type="number" id="editDist" placeholder="30" min="5" max="35" step="0.5" />
      <label class="form-label">完了時間</label>
      <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px;">
        <div>
          <label class="form-label" style="margin-bottom: 4px; font-size: 11px;">時</label>
          <input type="number" id="editH" placeholder="0" min="0" max="9" style="margin-bottom: 0;" />
        </div>
        <div>
          <label class="form-label" style="margin-bottom: 4px; font-size: 11px;">分</label>
          <input type="number" id="editM" placeholder="45" min="0" max="59" style="margin-bottom: 0;" />
        </div>
        <div>
          <label class="form-label" style="margin-bottom: 4px; font-size: 11px;">秒</label>
          <input type="number" id="editS" placeholder="30" min="0" max="59" style="margin-bottom: 0;" />
        </div>
      </div>
      <button class="btn-primary" onclick="updateRecord()" style="margin-bottom: 8px;">更新</button>
      <button onclick="deleteRecord()" class="btn-secondary" style="width: 100%;">削除</button>
    </div>
  </div>
</div>
 
<script>
const MONTHS = ['4月','5月','6月','7月','8月','9月','10月','11月','12月','1月','2月','3月'];
const PACES = [
  { val: '400', label: "4'00/km", rank: 6, limitMin: 120 },
  { val: '415', label: "4'15/km", rank: 5, limitMin: 127.5 },
  { val: '430', label: "4'30/km", rank: 4, limitMin: 135 },
  { val: '500', label: "5'00/km", rank: 3, limitMin: 150 },
  { val: '530', label: "5'30/km", rank: 2, limitMin: 165 },
  { val: '630', label: "6'30/km", rank: 1, limitMin: 195 }
];
 
let users = { 
  'TT': { name:'田中 太郎', pass:'pass1234', records:
    [{month:0,dist:25,pace:'630',h:3,m:12,s:0,total:192},{month:1,dist:28,pace:'530',h:3,m:5,s:30,total:185.5},{month:2,dist:30,pace:'530',h:2,m:58,s:0,total:178},
     {month:3,dist:30,pace:'500',h:2,m:52,s:15,total:172.25},{month:4,dist:30,pace:'430',h:2,m:49,s:0,total:169}]
  }
};
let currentUser = null;
let editingRecordMonth = null;
 
function showMsg(id, msg, color) {
  const el = document.getElementById(id);
  el.style.display = 'block';
  el.style.color = color || '#333';
  el.textContent = msg;
  setTimeout(() => { el.style.display = 'none'; }, 3000);
}
 
function doLogin() {
  const name = document.getElementById('loginName').value.trim();
  const pass = document.getElementById('loginPass').value;
  
  let uid = null;
  Object.keys(users).forEach(k => {
    if (users[k].name === name && users[k].pass === pass) {
      uid = k;
    }
  });
  
  if (!uid) {
    if (!name || !pass) { showMsg('authMsg','名前とパスワードを入力してください','#c33'); return; }
    if (pass.length < 4) { showMsg('authMsg','パスワードは4文字以上にしてください','#c33'); return; }
    const newUid = name.substring(0,2).toUpperCase();
    users[newUid] = { name, pass, records:[] };
    uid = newUid;
  }
  
  loginAs(uid);
}
 
function loginAs(uid) {
  currentUser = uid;
  document.getElementById('loginPage').classList.remove('active');
  document.getElementById('mainPage').classList.add('active');
  document.getElementById('displayName').textContent = users[uid].name;
  document.getElementById('avatarInitials').textContent = users[uid].name.slice(0,2);
  document.getElementById('shareName').textContent = users[uid].name;
  populateMonthSelect();
  refreshAll();
}
 
function doLogout() {
  currentUser = null;
  document.getElementById('mainPage').classList.remove('active');
  document.getElementById('loginPage').classList.add('active');
  document.getElementById('loginName').value = '';
  document.getElementById('loginPass').value = '';
  switchTab('dashboard', true);
}
 
function switchTab(name) {
  const tabs = document.querySelectorAll('.tab-bar .tab');
  const pages = {dashboard:'tabDashboard', record:'tabRecord', share:'tabShare'};
  tabs.forEach((btn,i) => { btn.classList.toggle('active', ['dashboard','record','share'][i]===name); });
  Object.keys(pages).forEach(k => { document.getElementById(pages[k]).classList.remove('active'); });
  document.getElementById(pages[name]).classList.add('active');
  if (name==='share') refreshShare();
}
 
function populateMonthSelect() {
  const selectors = [document.getElementById('recMonth'), document.getElementById('editMonth')];
  selectors.forEach(sel => {
    sel.innerHTML = '<option value="">選択してください</option>';
    MONTHS.forEach((m,i) => {
      const opt = document.createElement('option');
      const yearLabel = i <= 8 ? '2026年' : '2027年';
      opt.value = i; opt.textContent = `${yearLabel} ${m}`;
      sel.appendChild(opt);
    });
  });
}
 
function fmtTime(totalMin) {
  const h = Math.floor(totalMin/60), m = Math.floor(totalMin%60), s = Math.round((totalMin%1)*60);
  return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
 
function getPaceLabel(val) {
  return PACES.find(p => p.val === val)?.label || '—';
}
 
function getPaceRank(val) {
  return PACES.find(p => p.val === val)?.rank || 0;
}
 
function saveRecord() {
  const month = document.getElementById('recMonth').value;
  const pace = document.getElementById('recPace').value;
  const dist = parseFloat(document.getElementById('recDist').value)||0;
  const h = parseInt(document.getElementById('recH').value)||0;
  const m = parseInt(document.getElementById('recM').value)||0;
  const s = parseInt(document.getElementById('recS').value)||0;
  if (month===''||pace===''||dist===0||(!h&&!m&&!s)) { showMsg('recMsg','すべての項目を入力してください','#c33'); return; }
  const total = h*60 + m + s/60;
  if (total<60||total>600||dist<5||dist>35) { showMsg('recMsg','入力値が正しくありません','#c33'); return; }
  const records = users[currentUser].records;
  const mi = parseInt(month);
  const existing = records.findIndex(r=>r.month===mi);
  if (existing>=0) records[existing]={month:mi,dist,pace,h,m,s,total};
  else records.push({month:mi,dist,pace,h,m,s,total});
  records.sort((a,b)=>a.month-b.month);
  showMsg('recMsg','✓ 記録を保存しました','#3B6D11');
  document.getElementById('recMonth').value = '';
  document.getElementById('recPace').value = '';
  document.getElementById('recDist').value = '';
  document.getElementById('recH').value = '';
  document.getElementById('recM').value = '';
  document.getElementById('recS').value = '';
  refreshAll();
}
 
function openEditModal(month) {
  const records = users[currentUser].records;
  const rec = records.find(r => r.month === month);
  if (!rec) return;
  editingRecordMonth = month;
  document.getElementById('editMonth').value = month;
  document.getElementById('editPace').value = rec.pace;
  document.getElementById('editDist').value = rec.dist;
  document.getElementById('editH').value = rec.h;
  document.getElementById('editM').value = rec.m;
  document.getElementById('editS').value = rec.s;
  document.getElementById('editModal').style.display = 'flex';
}
 
function closeEditModal() {
  document.getElementById('editModal').style.display = 'none';
  editingRecordMonth = null;
}
 
function updateRecord() {
  const records = users[currentUser].records;
  const rec = records.find(r => r.month === editingRecordMonth);
  if (!rec) return;
  const pace = document.getElementById('editPace').value;
  const dist = parseFloat(document.getElementById('editDist').value)||0;
  const h = parseInt(document.getElementById('editH').value)||0;
  const m = parseInt(document.getElementById('editM').value)||0;
  const s = parseInt(document.getElementById('editS').value)||0;
  if (pace===''||dist===0||(!h&&!m&&!s)) { showMsg('recMsg','すべての項目を入力してください','#c33'); return; }
  const total = h*60 + m + s/60;
  if (total<60||total>600||dist<5||dist>35) { showMsg('recMsg','入力値が正しくありません','#c33'); return; }
  rec.pace = pace;
  rec.dist = dist;
  rec.h = h;
  rec.m = m;
  rec.s = s;
  rec.total = total;
  closeEditModal();
  showMsg('recMsg','✓ 記録を更新しました','#3B6D11');
  refreshAll();
}
 
function deleteRecord() {
  if (!confirm('この記録を削除しますか？')) return;
  const records = users[currentUser].records;
  const idx = records.findIndex(r => r.month === editingRecordMonth);
  if (idx >= 0) records.splice(idx, 1);
  closeEditModal();
  showMsg('recMsg','✓ 記録を削除しました','#3B6D11');
  refreshAll();
}
 
function getHighestPace(records) {
  if (!records.length) return null;
  const paces = records.map(r => getPaceRank(r.pace));
  return Math.max(...paces);
}
 
function getPaceBadges(records) {
  const badges = {};
  PACES.forEach(p => {
    badges[p.val] = records.some(r => {
      const paceObj = PACES.find(pace => pace.val === r.pace);
      return r.pace === p.val && r.dist >= 30 && r.total <= paceObj.limitMin;
    });
  });
  return badges;
}
 
function refreshAll() {
  if (!currentUser) return;
  const records = users[currentUser].records;
  const finished = records.filter(r => {
    const paceObj = PACES.find(p => p.val === r.pace);
    return r.dist >= 30 && r.total <= paceObj.limitMin;
  }).length;
  const bestTime = records.length ? Math.min(...records.map(r=>r.total)) : null;
  const maxDist = Math.max(...records.map(r=>r.dist), 0);
 
  document.getElementById('mCount').textContent = records.length;
  document.getElementById('mFinished').textContent = finished;
  document.getElementById('mBest').textContent = bestTime ? fmtTime(bestTime) : '—';
  document.getElementById('mMaxDist').textContent = maxDist ? maxDist.toFixed(1) : '—';
 
  if (records.length > 0) {
    const uniquePaces = [...new Set(records.map(r => r.pace))];
    const currentPaces = uniquePaces.map(p => getPaceLabel(p)).join(' → ');
    document.getElementById('paceBadgeContainer').innerHTML = `<div class="pace-badge">${currentPaces}</div>`;
  } else {
    document.getElementById('paceBadgeContainer').innerHTML = '';
  }
 
  renderPaceLadder(records);
  renderAchievements(records);
  renderRecordList(records);
}
 
function renderPaceLadder(records) {
  const container = document.getElementById('paceLadder');
  const paceRanks = getPaceBadges(records);
  const allPaces = new Set(records.map(r => r.pace));
  
  container.innerHTML = PACES.map(p => {
    const isAchieved = paceRanks[p.val];
    const hasAttempted = allPaces.has(p.val);
    
    let status = 'upcoming';
    let badge = '🎯';
    if (isAchieved) {
      status = 'achieved';
      badge = '✓';
    } else if (hasAttempted) {
      status = 'current';
      badge = '💪';
    }
    
    return `
      <div class="pace-step ${status}">
        <div class="pace-step-info">
          <div class="pace-step-pace">${p.label}</div>
          <div class="pace-step-desc">${isAchieved ? '30km完走達成' : hasAttempted ? 'チャレンジ中' : 'チャレンジ待機中'}</div>
        </div>
        <div class="pace-step-badge">${badge}</div>
      </div>
    `;
  }).join('');
}
 
function renderAchievements(records) {
  const container = document.getElementById('achievementGrid');
  const finished = records.filter(r => {
    const paceObj = PACES.find(p => p.val === r.pace);
    return r.dist >= 30 && r.total <= paceObj.limitMin;
  }).length;
  const paceRanks = getPaceBadges(records);
  const uniquePaces = new Set(records.map(r => r.pace));
  
  const badges = [
    { id: 'first', name: '初参加', desc: 'イベント初参加', class: 'first', cond: records.length >= 1 },
    { id: 'three', name: '3回連続', desc: '3回連続参加', class: 'three', cond: records.length >= 3 },
    { id: 'sixmonths', name: '6回参加', desc: '合計6回以上', class: 'speedup', cond: records.length >= 6 },
    { id: 'finish', name: '完走', desc: '30km完走達成', class: 'finish', cond: finished >= 1 },
    { id: 'triple', name: 'トリプル', desc: '完走3回以上', class: 'triple', cond: finished >= 3 },
    { id: 'speedup', name: 'ランクアップ', desc: 'ランクアップ達成', class: 'speedup', cond: uniquePaces.size >= 2 },
    { id: 'elite', name: 'エリート', desc: '上位ランク完走', class: 'elite', cond: (paceRanks['400'] || paceRanks['415'] || paceRanks['430']) },
  ];
  
  container.innerHTML = badges.map(b => {
    const unlocked = b.cond;
    const nums = ['①', '②', '③', '④', '⑤', '⑥', '⑦'];
    const num = badges.findIndex(x => x.id === b.id);
    return `
      <div class="badge-card ${unlocked ? 'unlocked' : 'locked'}">
        <div class="badge-visual ${b.class}">${nums[num]}</div>
        <div class="badge-name">${b.name}</div>
        <div class="badge-desc">${b.desc}</div>
      </div>
    `;
  }).join('');
}
 
function renderRecordList(records) {
  const list = document.getElementById('recordList');
  if (!records.length) { list.innerHTML='<div class="empty-state">まだ記録がありません</div>'; return; }
  
  const sorted = [...records].sort((a,b) => a.month - b.month);
  list.innerHTML = sorted.map((r, i) => {
    let trend = '';
    if (i > 0) {
      const prevDist = sorted[i-1].dist;
      const distChange = r.dist - prevDist;
      if (distChange > 0) trend = `<span style="color:#3B6D11;font-size:11px;">↑ +${distChange.toFixed(1)}km</span>`;
      else if (distChange < 0) trend = `<span style="color:#c33;font-size:11px;">↓ ${distChange.toFixed(1)}km</span>`;
    }
    const badge = r.dist >= 30 ? '🏆' : r.dist >= 28 ? '💪' : r.dist >= 25 ? '🎯' : '';
    const yearLabel = r.month <= 8 ? '2026年' : '2027年';
    return `
      <div class="record-row">
        <div class="record-row-info">
          <div class="record-row-label">${badge} ${yearLabel} ${MONTHS[r.month]}</div>
          <div class="record-row-meta">${getPaceLabel(r.pace)} / ${fmtTime(r.total)} / ${r.dist}km ${trend}</div>
        </div>
        <div class="record-row-actions">
          <button class="btn-small" onclick="openEditModal(${r.month})">編集</button>
        </div>
      </div>
    `;
  }).join('');
}
 
function drawShareGraph(records) {
  const svg = document.getElementById('shareGraph');
  if (!svg || records.length === 0) return;
  
  const paths = svg.querySelectorAll('*');
  paths.forEach(p => { if (p.tagName !== 'title' && p.tagName !== 'desc') p.remove(); });
  
  const sorted = [...records].sort((a, b) => a.month - b.month);
  
  const padding = 35;
  const width = 280 - padding * 2;
  const height = 80 - padding;
  const barWidth = Math.max(18, width / (sorted.length * 1.5));
  const spacing = width / sorted.length;
  
  // スケール：距離（0-35km）と時間色を使用
  const maxTime = Math.max(...sorted.map(r => r.total));
  const minTime = Math.min(...sorted.map(r => r.total));
  const timeRange = maxTime - minTime || 1;
  
  // 背景グリッド線
  for (let i = 0; i <= 3; i++) {
    const y = padding + (height / 3) * i;
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', padding);
    line.setAttribute('y1', y);
    line.setAttribute('x2', 280 - padding);
    line.setAttribute('y2', y);
    line.setAttribute('stroke', 'rgba(255,255,255,0.1)');
    line.setAttribute('stroke-width', '0.5');
    svg.appendChild(line);
  }
  
  // 棒グラフ
  sorted.forEach((r, i) => {
    const x = padding + (i * spacing) + (spacing - barWidth) / 2;
    const distRatio = r.dist / 35;
    const barHeight = distRatio * height;
    const y = padding + height - barHeight;
    
    // 時間に基づいた色（遅い→明るい、速い→濃い）
    const timeNorm = (r.total - minTime) / timeRange;
    const hue = 200 + (timeNorm * 40); // 青から青緑
    const saturation = 100;
    const lightness = 45 + (timeNorm * 15); // 暗い→明るい
    const barColor = `hsl(${hue}, ${saturation}%, ${lightness}%)`;
    
    // 棒
    const bar = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    bar.setAttribute('x', x);
    bar.setAttribute('y', y);
    bar.setAttribute('width', barWidth);
    bar.setAttribute('height', barHeight);
    bar.setAttribute('fill', barColor);
    bar.setAttribute('rx', '2');
    svg.appendChild(bar);
    
    // 距離ラベル（棒の上）
    if (r.dist >= 30) {
      const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      label.setAttribute('x', x + barWidth / 2);
      label.setAttribute('y', y - 3);
      label.setAttribute('text-anchor', 'middle');
      label.setAttribute('font-size', '9');
      label.setAttribute('font-weight', 'bold');
      label.setAttribute('fill', '#FFD700');
      label.textContent = 'clear‼';
      svg.appendChild(label);
    } else {
      const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      label.setAttribute('x', x + barWidth / 2);
      label.setAttribute('y', y - 3);
      label.setAttribute('text-anchor', 'middle');
      label.setAttribute('font-size', '10');
      label.setAttribute('fill', 'rgba(255,255,255,0.7)');
      label.textContent = r.dist.toFixed(0) + 'km';
      svg.appendChild(label);
    }
    
    // ペースラベル（棒の下）
    const paceLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    paceLabel.setAttribute('x', x + barWidth / 2);
    paceLabel.setAttribute('y', padding + height + 14);
    paceLabel.setAttribute('text-anchor', 'middle');
    paceLabel.setAttribute('font-size', '9');
    paceLabel.setAttribute('fill', 'rgba(255,255,255,0.8)');
    paceLabel.textContent = getPaceLabel(r.pace);
    svg.appendChild(paceLabel);
  });
  
  // Y軸ラベル
  const yLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  yLabel.setAttribute('x', 8);
  yLabel.setAttribute('y', padding);
  yLabel.setAttribute('font-size', '9');
  yLabel.setAttribute('fill', 'rgba(255,255,255,0.6)');
  yLabel.textContent = '30km';
  svg.appendChild(yLabel);
}
 
function refreshShare() {
  if (!currentUser) return;
  const records = users[currentUser].records;
  const finished = records.filter(r => {
    const paceObj = PACES.find(p => p.val === r.pace);
    return r.dist >= 30 && r.total <= paceObj.limitMin;
  }).length;
  const bestTime = records.length ? Math.min(...records.map(r=>r.total)) : null;
  const highestRank = getHighestPace(records);
 
  document.getElementById('shareCount').textContent = records.length + '回';
  document.getElementById('shareFinished').textContent = finished + '回';
  document.getElementById('shareBest').textContent = bestTime ? fmtTime(bestTime) : '—';
  document.getElementById('shareHighestPace').textContent = highestRank ? getPaceLabel(PACES[6-highestRank].val) : '—';
 
  drawShareGraph(records);
 
  const paceRanks = getPaceBadges(records);
  const badges = [];
  if (records.length >= 1) badges.push({ img: 'images/badge-1.png' });
  if (records.length >= 3) badges.push({ img: 'images/badge-2.png' });
  if (records.length >= 6) badges.push({ img: 'images/badge-3.png' });
  if (finished >= 1) badges.push({ img: 'images/badge-4.png' });
  if (finished >= 3) badges.push({ img: 'images/badge-5.png' });
  if (new Set(records.map(r => r.pace)).size >= 2) badges.push({ img: 'images/badge-6.png' });
  if (paceRanks['400'] || paceRanks['415'] || paceRanks['430']) badges.push({ img: 'images/badge-7.png' });
  
  document.getElementById('shareBadgesContainer').innerHTML = badges.map(b => 
    `<img src="${b.img}" style="width:32px;height:32px;border-radius:6px;object-fit:cover;" onerror="this.style.display='none'">`
  ).join('');
}
 
function doShare() {
  alert('スクリーンショットでSNSにシェアしてください！\n#30kmRun #月例ラン #ランニングチャレンジ');
}
 
refreshAll();
</script>
